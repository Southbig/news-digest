name: Check for updates

on:
  schedule:
    - cron: "23 */3 * * *" # 3시간마다 (정각 폴링 혼잡을 피해 23분)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check feeds and notify
        run: npm run check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_AI_NEWS: ${{ secrets.SLACK_WEBHOOK_AI_NEWS }}
          SLACK_WEBHOOK_STOCKS: ${{ secrets.SLACK_WEBHOOK_STOCKS }}
          SLACK_WEBHOOK_INDUSTRIES: ${{ secrets.SLACK_WEBHOOK_INDUSTRIES }}
          SLACK_WEBHOOK_COMMODITIES: ${{ secrets.SLACK_WEBHOOK_COMMODITIES }}

      - name: Commit updated state
        run: |
          git add state.json archive
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update state"
            # 레포에 쓰는 워크플로가 둘 이상이므로 push 전에 원격 변경을 흡수한다
            git pull --rebase
            git push
          fi
