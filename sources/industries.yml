# 산업군 동향 — Google News 검색 RSS
#
# channel: industries → SLACK_WEBHOOK_INDUSTRIES 웹훅으로 전송.
#   시크릿이 없으면 SLACK_WEBHOOK_URL(#tech_news)로 폴백되므로, 시크릿부터 등록할 것.
#
# name 은 stock-insight-report 의 KR 업종 라벨(var/cache/kr_industry.json, 62개)을
# 뉴스 단위로 묶은 것이다. 각 항목의 주석에 대응 업종 라벨을 적어두었다 —
# 나중에 리포트의 업종별 점수·수익률과 조인할 때 매핑표 대신 이 주석을 쓴다.
#
# maxPerRun: 1 — 산업 뉴스는 기사가 잦다. 소스 34개, 실행 1회당 최대 34건(모든 피드에 새 기사가 있을 때).
#   실행 5~6회/일 기준 이론상 상한 ~200건/일 — 실제로는 새 기사가 있는 소스만 발송된다.
#   너무 많으면 필요 없는 블록을 주석 처리하면 된다 (state.json 은 건드릴 필요 없음).

